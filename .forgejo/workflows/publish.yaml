name: CI & Publish Docker Image
run-name: ${{ github.actor }} is building and publishing a Docker image
on:
  push:
    branches:
      - main
      - 6-devenv

jobs:
  Build-And-Publish-Docker:
    runs-on: local
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Build and Push Docker Image
        run: |
          # Define image name using your Docker Hub username/org and repository name
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}"

          echo "Building image: $IMAGE_NAME:latest"
          docker build -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:${{ github.sha }}" .

          echo "Pushing images to Docker Hub..."
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"

      - name: Notify ntfy
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_AUTH: ${{ secrets.NTFY_AUTH }}
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            TITLE="🐳 Docker Build & Push: Success"
            TAGS="whale,rocket,package"
          else
            TITLE="❌ Docker Build & Push: Failed"
            TAGS="warning,boom"
          fi

          curl \
            -H "Authorization: Bearer $NTFY_AUTH" \
            -H "Title: $TITLE" \
            -H "Tags: $TAGS" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions" \
            -d "Repo: ${{ github.repository }}
          Status: ${{ job.status }}
          Docker image built and pushed via self-hosted DinD runner." \
            "$NTFY_URL"
