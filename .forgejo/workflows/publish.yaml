name: Production Docker Image

on:
  push:
    branches:
      - main
      - 1-docker-pack

jobs:
  build:
    runs-on: local
    # We remove the hardcoded 'container' block so community actions can run natively.
    # Instead, we spin up DinD as a sidecar service if your runner needs an isolated daemon.
    services:
      docker:
        image: docker:dind
        ports:
          - 2375:2375

    env:
      DOCKER_HOST: tcp://localhost:2375

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Sets up nested submodules automatically without manual git steps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:master # Ensures Buildx can communicate across the network

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # TODO: Remember to change 'your-dockerhub-namespace' to your actual Docker Hub username/org
          tags: ouslan/fsdc-api:production
          # Adding cache-from and cache-to makes subsequent builds blazing fast
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify ntfy
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_AUTH: ${{ secrets.NTFY_AUTH }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="🚀 Docker Build: Success"
            TAGS="rocket,package"
          else
            TITLE="❌ Docker Build: Failed"
            TAGS="warning,boom"
          fi

          curl \
            -H "Authorization: Bearer $NTFY_AUTH" \
            -H "Title: $TITLE" \
            -H "Tags: $TAGS" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions" \
            -d "Repo: ${{ github.repository }}
          Status: ${{ job.status }}
          Image pushed to Docker Hub via Forgejo runner." \
            "$NTFY_URL"
