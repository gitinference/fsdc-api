name: CI & Publish Container (devenv)
run-name: ${{ github.actor }} is publishing to Docker Hub
on:
  push:
    branches:
      - main

jobs:
  Build-And-Publish:
    runs-on: local
    env:
      USER: root

    steps:
      - name: Install sudo and Node.js (Required for Nix script)
        run: |
          apt-get update
          apt-get install -y sudo nodejs curl xz-utils

      - name: Check out code
        uses: https://github.com/actions/checkout.git@v4

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action.git@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            sandbox = false
            trusted-users = root @wheel
            substituters = https://cache.nixos.org https://devenv.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: Set up Cachix Cache
        uses: https://github.com/cachix/cachix-action.git@v16
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add github:cachix/devenv/v2.1.2

      - name: Build and Deploy Container
        shell: devenv shell --profile container-build bash -- -e {0}
        run: |
          prod-deploy
        env:
          DOCKER_HOST: tcp://docker-in-docker:2375
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Notify ntfy
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_AUTH: ${{ secrets.NTFY_AUTH }}
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            TITLE="🚀 Container Publish: Success"
            TAGS="rocket,whale"
          else
            TITLE="❌ Container Publish: Failed"
            TAGS="warning,boom"
          fi

          curl \
            -H "Authorization: Bearer $NTFY_AUTH" \
            -H "Title: $TITLE" \
            -H "Tags: $TAGS" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions" \
            -d "Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Status: ${{ job.status }}
          Published via devenv on self-hosted runner." \
            "$NTFY_URL"
