name: Production Docker Image

on:
  push:
    branches:
      - main
      - 1-docker-pack

jobs:
  build:
    runs-on: local
    env:
      # This tells the Forgejo runner's internal orchestration where to launch the action containers
      DOCKER_HOST: tcp://127.0.0.1:2375
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # Crucial: Buildx must connect to the local loopback interface 
      # because it's running inside the DinD space already.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://127.0.0.1:2375

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ouslan/fsdc-api:production
          cache-from: type=registry,ref=ouslan/fsdc-api:buildcache
          cache-to: type=registry,ref=ouslan/fsdc-api:buildcache,mode=max

      - name: Notify ntfy
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_AUTH: ${{ secrets.NTFY_AUTH }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="🚀 Docker Build: Success"
            TAGS="rocket,package"
          else
            TITLE="❌ Docker Build: Failed"
            TAGS="warning,boom"
          fi

          curl \
            -H "Authorization: Bearer $NTFY_AUTH" \
            -H "Title: $TITLE" \
            -H "Tags: $TAGS" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions" \
            -d "Repo: ${{ github.repository }}
          Status: ${{ job.status }}
          Image pushed to Docker Hub via Forgejo runner." \
            "$NTFY_URL"
